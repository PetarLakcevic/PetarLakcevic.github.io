<script>
document.getElementById('gate').addEventListener('submit',async e=>{e.preventDefault();const i=document.getElementById('gate-pass'),err=document.getElementById('gate-err');

if(hex===GATE){try{localStorage.setItem('vezuv-gate-v2',GATE)}catch(x){}document.documentElement.classList.remove('locked');i.value='';err.hidden=true;scrollTo(0,0)}else{err.hidden=false;i.select()}});
