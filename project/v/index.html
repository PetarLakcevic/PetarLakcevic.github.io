<style>
:root {
  --ink: #17171C; --muted: #85848F; --line: #E2E1E8; --paper: #FFFFFF; --mist: #F3F3F6; --viewer: #0F0E12;
  --body: 'Segoe UI', Arial, Helvetica, sans-serif; --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--body); }
img, svg { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
main { max-width: 1320px; margin: 0 auto; padding: clamp(28px, 4vw, 56px) clamp(16px, 3vw, 40px) clamp(40px, 5vw, 72px); display: grid; gap: clamp(28px, 4vw, 48px); }

.gate { display: none; }
.locked main { display: none; }
.locked .gate { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 16px; }
.gate form { display: grid; gap: 12px; width: min(100%, 340px); }
.gate h1 { font-size: 24px; margin: 0 0 8px; }
.gate label { display: grid; gap: 6px; font-size: 14.5px; color: #55545F; }

.gate p { margin: 0; font-size: 14px; color: #B3261E; }
h1 { margin: 0 0 10px; font-size: clamp(28px, 3.2vw, 40px); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.intro p { margin: 0; max-width: 66ch; font-size: 16px; line-height: 1.5; color: #55545F; text-wrap: pretty; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; margin: 0 0 14px; }
.no { font-size: 44px; font-weight: 300; line-height: 1; color: #B4B3BE; font-variant-numeric: tabular-nums; }
h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
.head p { margin: 0; font-size: 14.5px; color: var(--muted); }
.now { display: flex; justify-content: center; padding: clamp(24px, 3vw, 36px); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.now img { width: clamp(200px, 22vw, 300px); height: auto; }

.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 22px); align-items: start; }
.group { background: var(--mist); border-radius: 18px; padding: 8px; display: grid; gap: 8px; min-width: 0; }
h3 { margin: 4px 6px 2px; font-size: 15px; font-weight: 600; line-height: 1.3; }

.tile { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: clamp(130px, 13vw, 180px); padding: 22px 34px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; transition: border-color .15s; }
.tile:hover { border-color: var(--ink); }
.tile svg { width: min(100%, 260px); max-height: 76px; }
.tile span, .n { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile span { position: absolute; left: 12px; bottom: 8px; }

.cmp-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--mist); padding: 3px; border-radius: 10px; }
.seg button { font-size: 14.5px; border: 0; background: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.ci { min-width: 0; }
.n { display: block; margin: 2px 4px 4px; }
.v { display: none; border-radius: var(--r); align-items: center; justify-content: center; min-height: 170px; padding: 18px; }
.v.m-light { background: var(--paper); border: 1px solid var(--line); }
.cmp[data-tab="logo"][data-mode="light"] .v-logo.m-light, .cmp[data-tab="logo"][data-mode="dark"] .v-logo.m-dark,
.cmp[data-tab="mark"][data-mode="light"] .v-mark.m-light, .cmp[data-tab="mark"][data-mode="dark"] .v-mark.m-dark,
.cmp[data-tab="site"][data-mode="light"] .v-site.m-light, .cmp[data-tab="site"][data-mode="dark"] .v-site.m-dark,
.cmp[data-tab="icon"] .v-icon, .cmp[data-tab="card"] .v-card, .cmp[data-tab="wall"] .v-wall { display: flex; }
.cmp[data-tab="icon"] #cmp-mode, .cmp[data-tab="card"] #cmp-mode, .cmp[data-tab="wall"] #cmp-mode { visibility: hidden; }
.v-logo svg { width: min(78%, 300px); max-height: 100px; }
.v-mark svg { height: 100px; width: auto; }
.v-icon { background: var(--paper); border: 1px solid var(--line); gap: 18px; align-items: flex-end; min-height: 0; padding: 26px 18px 20px; }
.v-icon > div { display: grid; justify-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.v-card { padding: 0; gap: 8px; min-height: 0; }
.v-card > div { flex: 1 1 0; min-width: 0; }
.v-card svg { width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,.14); }
.v-site { padding: 0; }
.v-wall { padding: 0; min-height: 0; overflow: hidden; background: var(--viewer); }
.v-wall img { width: 100%; height: auto; }
.demo { width: 100%; padding: 16px 18px; display: flex; flex-direction: column; min-height: 280px; color: #4F4F62; font-family: var(--tf); }
.demo .dn { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #D8D9DE; padding-bottom: 12px; }
.demo .dn svg { width: var(--nl, 104px); max-height: 34px; }
.demo .dn span { font-size: 9px; white-space: nowrap; font-family: var(--nf); }
.demo h4 { font-family: var(--hf); font-weight: var(--hw); font-size: var(--hs); line-height: var(--hl); letter-spacing: var(--hk); margin: 22px 0 8px; }
.demo p { font-size: 12px; margin: 0 0 12px; max-width: 28ch; }
.demo .cta { margin-top: auto; padding-top: 10px; font-size: 12px; border-top: 1px solid #7777; }
.v-site.m-dark .demo { color: #fff; } .v-site.m-dark .demo .dn { border-color: #52515C; }

dialog { border: 0; padding: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; background: var(--viewer); color: #fff; }
dialog::backdrop { background: var(--viewer); }
dialog:focus { outline: none; }
dialog :focus-visible { outline-color: #fff; }
.vw { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.vw-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px clamp(12px, 2vw, 22px); }
.vw-top p { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.vw-top div { display: flex; gap: 8px; flex-shrink: 0; }
.vbtn { font-size: 14px; color: #fff; background: none; border: 1px solid #FFFFFF44; border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
.vbtn:hover { background: #fff; color: #111; }
.vw-main { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; padding: 0 clamp(8px, 5vw, 72px); }
#vw-page { flex: none; overflow: hidden; border-radius: 4px; background: #fff; }
.vw-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 64px; font-size: 26px; line-height: 1; color: #fff; background: #26252C; border: 0; border-radius: 10px; cursor: pointer; }
.vw-nav:hover { background: #3F3E47; } .vw-prev { left: clamp(4px, 1vw, 14px); } .vw-next { right: clamp(4px, 1vw, 14px); }
.vw-thumbs { display: flex; justify-content: safe center; gap: 6px; padding: 10px; overflow-x: auto; }
.vw-thumbs button { flex: 0 0 auto; width: 76px; aspect-ratio: 297 / 210; padding: 0; border: 2px solid transparent; border-radius: 4px; overflow: hidden; background: none; cursor: pointer; opacity: .6; }
.vw-thumbs button[aria-current="true"] { border-color: #fff; opacity: 1; }
.vw-thumbs img { width: 100%; height: 100%; object-fit: cover; }

@media (max-width: 860px) {
  .groups { grid-template-columns: minmax(0, 1fr); }
  .vw-nav { width: 30px; height: 52px; font-size: 22px; }
  .cmp[data-tab="icon"] #cmp-mode, .cmp[data-tab="card"] #cmp-mode, .cmp[data-tab="wall"] #cmp-mode { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }

.home { min-height: 100vh; min-height: 100dvh; align-content: center; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 32px; padding-bottom: clamp(14px, 1.8vw, 22px); border-bottom: 1px solid var(--ink); }
.top h1 { margin: 0; font-size: clamp(32px, 4.2vw, 58px); line-height: 1.06; letter-spacing: -.025em; }
.top p { margin: 0; font-size: 15px; color: #6B6A75; }
.hub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 3vw, 40px) clamp(14px, 1.8vw, 24px); }
.hub a { display: block; min-width: 0; color: inherit; text-decoration: none; border-radius: var(--r); }
.pic { aspect-ratio: 3 / 2; overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .2s; }
.hub a:hover .pic { border-color: var(--ink); }
.pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2, .7, .2, 1); }
.hub a:hover .pic img { transform: scale(1.025); }
.pic-logos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 3px; }
.pic-logos > div { min-width: 0; min-height: 0; }
.pic-logos svg { width: 100%; height: 100%; filter: grayscale(1); }
.pic-strips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.pic-strips div { min-width: 0; min-height: 0; overflow: hidden; }
.name { display: flex; align-items: baseline; gap: 12px; padding: 14px 8px 0 2px; }
.name b { font-size: 19px; font-weight: 600; }
.idx, .name small { font-size: 14px; color: #6B6A75; font-variant-numeric: tabular-nums; }
.name small { margin-left: auto; }
.arr { flex: none; align-self: center; transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
.hub a:hover .arr { transform: translateX(6px); }
.back { display: inline-block; margin-bottom: 14px; font-size: 14.5px; color: #6B6A75; text-decoration: none; }
.back:hover { color: var(--ink); }
.hub-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.web-note { margin: 0; max-width: 60ch; font-size: 16px; line-height: 1.5; color: #55545F; text-wrap: pretty; }
@media (max-width: 640px) {
  .hub, .hub-3 { grid-template-columns: minmax(0, 1fr); }
  .pic-logos { aspect-ratio: 4 / 3; }
  .home { align-content: start; }
}
@media (prefers-reduced-motion: reduce) { .pic, .pic img, .arr { transition: none; } }
